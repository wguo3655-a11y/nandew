    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="南风润物首页"><img src="assets/nandew-logo.webp" alt="南风润物 NANDEW" width="136" height="68"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav"><span class="menu-icon" aria-hidden="true"></span>菜单</button>
      <nav id="main-nav" class="site-nav" aria-label="主导航">

      </nav>
    </div>
  </header>
  <main class="wrap interior" id="main">
    <header class="page-heading">
      <h1>合作联系</h1>
      <p>产品咨询、陶瓷家居设计、品牌联名及展陈合作。</p>
    </header>
    <div class="inquiry-grid">
      <section class="inquiry-panel" aria-labelledby="partner-title">
        <h2 id="partner-title">合作方向</h2>
        <h3>陶艺共创</h3><p>面向陶瓷家居器物的造型与材质合作。</p>
        <h3>品牌联名</h3><p>结合品牌标识、刺猬角色形象和石湾陶艺元素开展联名设计。</p>
        <h3>展陈与体验</h3><p>面向陶艺、地方工艺与产品设计的展陈项目。</p>
      </section>
      <section class="inquiry-panel" aria-labelledby="draft-title">
        <h2 id="draft-title">准备合作需求</h2>
        <p>官方联系方式待补充。草稿可在此生成并复制。</p>
        <noscript><p>启用 JavaScript 后可使用草稿生成功能。</p></noscript>
        <form class="inquiry-form" data-inquiry hidden>
          <div class="form-field">
            <label for="inquiry-type">合作方向</label>
            <select name="type" id="inquiry-type"><option value="产品咨询">产品咨询</option><option value="陶艺共创" selected>陶艺共创</option><option value="品牌联名">品牌联名</option><option value="展陈与体验">展陈与体验</option><option value="其他合作">其他合作</option></select>
          </div>
          <label>合作设想
            <textarea name="brief" placeholder="简述拟合作的内容、场景和时间。" maxlength="1000" required></textarea>
          </label>
          <button class="button button--ink" type="submit">生成合作草稿</button>
          <label data-draft-field hidden>合作需求草稿
            <textarea data-output readonly></textarea>
          </label>
          <button class="button button--outline" type="button" data-copy hidden>复制草稿</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">

    </div>
  </footer>
